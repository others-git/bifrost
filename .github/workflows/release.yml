name: Release

on:
  push:
    tags: ["v*"]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  IMAGE: ghcr.io/${{ github.repository }}

permissions:
  contents: write # create the GitHub release
  packages: write # push to GHCR

jobs:
  release:
    name: Test, build image, publish
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # ── Test gate (same checks as CI) ────────────────────────────────────
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: npm ci && npm run build

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo registry + build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy (deny warnings)
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests
        run: cargo test

      # ── Static Linux binary ──────────────────────────────────────────────
      # musl target → a fully static binary that runs on any Linux (incl.
      # Alpine). The frontend was built above, so rust-embed bakes it in.
      - name: Add musl target
        run: rustup target add x86_64-unknown-linux-musl

      - name: Install musl tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build release binary (static musl)
        run: cargo build --release --locked --target x86_64-unknown-linux-musl

      - name: Package binary
        run: |
          set -euo pipefail
          BIN=target/x86_64-unknown-linux-musl/release/bifrost
          strip "$BIN"
          mkdir -p dist-bin
          ASSET="bifrost-${GITHUB_REF_NAME}-x86_64-linux-musl.tar.gz"
          tar -czf "dist-bin/${ASSET}" -C "$(dirname "$BIN")" bifrost
          (cd dist-bin && sha256sum "${ASSET}" > "${ASSET}.sha256")

      # ── Docker image ─────────────────────────────────────────────────────
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata (tags + labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── GitHub release ───────────────────────────────────────────────────
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            dist-bin/*
