[package]
name = "bifrost"
version = "0.29.6"
edition = "2024"

[lib]
name = "bifrost"
path = "src/lib.rs"

[[bin]]
name = "bifrost"
path = "src/main.rs"

[dependencies]
# async runtime
tokio = { version = "1", features = ["full"] }

# web framework
axum = { version = "0.8", features = ["ws", "macros", "multipart"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["fs", "cors", "trace"] }

# HTTP client
reqwest = { version = "0.12", features = ["json", "rustls-tls", "stream", "multipart"], default-features = false }

# serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# database
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "migrate", "uuid", "chrono"] }

# error handling
anyhow = "1"
thiserror = "2"

# config / env
dotenvy = "0.15"

# logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# types
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# async trait objects
async-trait = "0.1"

# SSE (Hue v2 event stream)
tokio-stream = { version = "0.1", features = ["sync"] }
eventsource-stream = "0.2"
# stream a cached file body (kiosk OTA APK relay)
tokio-util = { version = "0.7", features = ["io"] }

# credential encryption (AES-256-GCM)
aes-gcm = "0.10"

# password hashing (argon2)
argon2 = "0.5"

# static file embedding (frontend dist)
rust-embed = { version = "8", features = ["mime-guess"] }

# random bytes (nonce generation)
rand = "0.8"
hex = "0.4"
# deterministic hashing for API key lookup (keys are high-entropy)
sha2 = "0.10"
futures-util = "0.3"

# Android TV Remote v2 (smart-TV remote keys over TLS): raw TLS sockets with a
# self-signed RSA client cert. Pinned to the ring crypto provider already in the
# tree (no aws-lc-rs C dependency, keeps the static musl build clean).
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rsa = { version = "0.9", features = ["sha2"] }
x509-cert = { version = "0.2", features = ["builder", "pem"] }
signature = "2"
# embedded MCP server (Streamable HTTP) — the /mcp surface over the service layer
rmcp = { version = "1.7.0", features = ["server", "transport-streamable-http-server", "schemars"] }
schemars = "1" # JSON Schema for MCP tool argument structs
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }

[dev-dependencies]
wiremock = "0.6"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
