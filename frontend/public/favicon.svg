<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffdba6" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#ff9900" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Dark rounded background (matches app body #0f0f0f) -->
  <rect width="32" height="32" rx="7" fill="#0f0f0f"/>

  <!-- Bifrost: the rainbow bridge, in warm brand hues -->
  <!-- Outer band — gold -->
  <path d="M3 29.2 A13 18.2 0 0 1 29 29.2"
        stroke="#ffd166" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <!-- Middle band — brand orange -->
  <path d="M7.1 29.2 A8.9 13.1 0 0 1 24.9 29.2"
        stroke="#ff9900" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <!-- Inner band — ember -->
  <path d="M11.2 29.2 A4.8 8 0 0 1 20.8 29.2"
        stroke="#ff5a1f" stroke-width="2.5" fill="none" stroke-linecap="round"/>

  <!-- Smart light glowing beneath the arch -->
  <circle cx="16" cy="25.4" r="6" fill="url(#glow)"/>
  <circle cx="16" cy="25.4" r="2.3" fill="#fff4e0"/>
</svg>
