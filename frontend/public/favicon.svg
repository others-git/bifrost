<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <!-- Night sky: deep indigo fading to black at the horizon -->
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#141831"/>
      <stop offset="70%" stop-color="#0a0a14"/>
      <stop offset="100%" stop-color="#060609"/>
    </linearGradient>

    <!-- Full-spectrum sweep across the bridge — RGB lighting, not warm-only -->
    <linearGradient id="spectrum" gradientUnits="userSpaceOnUse" x1="4" y1="0" x2="28" y2="0">
      <stop offset="0%"   stop-color="#a855f7"/>
      <stop offset="18%"  stop-color="#3b82f6"/>
      <stop offset="38%"  stop-color="#22d3ee"/>
      <stop offset="55%"  stop-color="#4ade80"/>
      <stop offset="72%"  stop-color="#facc15"/>
      <stop offset="88%"  stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>

    <filter id="soften" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.1"/>
    </filter>

    <clipPath id="frame">
      <rect width="32" height="32" rx="7"/>
    </clipPath>
  </defs>

  <rect width="32" height="32" rx="7" fill="url(#sky)"/>

  <g clip-path="url(#frame)">
    <!-- Stars over Asgard -->
    <circle cx="6.5" cy="9"  r="0.55" fill="#e8ecff" opacity="0.75"/>
    <circle cx="24.5" cy="11" r="0.45" fill="#e8ecff" opacity="0.55"/>
    <circle cx="27" cy="5.5" r="0.6"  fill="#e8ecff" opacity="0.8"/>
    <circle cx="10" cy="4.5" r="0.4"  fill="#e8ecff" opacity="0.5"/>

    <!-- The destination: a four-point star above the apex -->
    <path d="M16 2.2 L16.8 4.7 L19.3 5.5 L16.8 6.3 L16 8.8 L15.2 6.3 L12.7 5.5 L15.2 4.7 Z"
          fill="#f4f7ff"/>

    <!-- Glow halo under the bridge -->
    <path d="M4 26 A12 14 0 0 1 28 26"
          stroke="url(#spectrum)" stroke-width="6.5" fill="none"
          opacity="0.3" filter="url(#soften)"/>

    <!-- Bifrost itself -->
    <path d="M4 26 A12 14 0 0 1 28 26"
          stroke="url(#spectrum)" stroke-width="3.2" fill="none"/>

    <!-- Faint reflection below the horizon -->
    <path d="M4 26 A12 14 0 0 1 28 26"
          stroke="url(#spectrum)" stroke-width="3.2" fill="none"
          transform="matrix(1 0 0 -1 0 52)" opacity="0.22" filter="url(#soften)"/>
  </g>
</svg>
