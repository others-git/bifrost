<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <!-- Night sky: deep indigo fading to black at the horizon -->
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#141831"/>
      <stop offset="70%" stop-color="#0a0a14"/>
      <stop offset="100%" stop-color="#060609"/>
    </linearGradient>

    <!-- Full-spectrum sweep across the bridge — RGB lighting, not warm-only -->
    <linearGradient id="spectrum" gradientUnits="userSpaceOnUse" x1="3" y1="0" x2="29" y2="0">
      <stop offset="0%"   stop-color="#a855f7"/>
      <stop offset="18%"  stop-color="#3b82f6"/>
      <stop offset="38%"  stop-color="#22d3ee"/>
      <stop offset="55%"  stop-color="#4ade80"/>
      <stop offset="72%"  stop-color="#facc15"/>
      <stop offset="88%"  stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>

    <filter id="soften" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.1"/>
    </filter>

    <clipPath id="frame">
      <rect width="32" height="32" rx="7"/>
    </clipPath>
  </defs>

  <rect width="32" height="32" rx="7" fill="url(#sky)"/>

  <g clip-path="url(#frame)">
    <!-- Stars over Asgard -->
    <circle cx="5.5" cy="8"  r="0.55" fill="#e8ecff" opacity="0.75"/>
    <circle cx="25.5" cy="9" r="0.45" fill="#e8ecff" opacity="0.55"/>
    <circle cx="27.5" cy="4.5" r="0.6" fill="#e8ecff" opacity="0.8"/>
    <circle cx="9.5" cy="3.5" r="0.4" fill="#e8ecff" opacity="0.5"/>

    <!-- The destination: a four-point star above the apex -->
    <path d="M16 1.6 L16.75 3.95 L19.1 4.7 L16.75 5.45 L16 7.8 L15.25 5.45 L12.9 4.7 L15.25 3.95 Z"
          fill="#f4f7ff"/>

    <!-- Glow halo behind the whole bridge -->
    <g stroke="url(#spectrum)" fill="none" opacity="0.32" filter="url(#soften)">
      <path d="M5 22.5 A11 10 0 0 1 27 22.5" stroke-width="6.5"/>
      <path d="M0 22.5 H32" stroke-width="6.5"/>
    </g>

    <!-- Bifrost: through-arch bridge, deck spanning shore to shore -->
    <g stroke="url(#spectrum)" fill="none">
      <!-- Hangers between arch and deck -->
      <g stroke-width="1.3" opacity="0.8" stroke-linecap="round">
        <line x1="10.5" y1="15.2" x2="10.5" y2="21.2"/>
        <line x1="16"  y1="13.9" x2="16"  y2="21.2"/>
        <line x1="21.5" y1="15.2" x2="21.5" y2="21.2"/>
      </g>
      <!-- Arch -->
      <path d="M5 22.5 A11 10 0 0 1 27 22.5" stroke-width="3.4" stroke-linecap="round"/>
      <!-- Deck: edge to edge -->
      <path d="M0 22.5 H32" stroke-width="3.4"/>
    </g>

    <!-- Faint reflection below the waterline -->
    <g stroke="url(#spectrum)" fill="none"
       transform="matrix(1 0 0 -1 0 49)" opacity="0.2" filter="url(#soften)">
      <path d="M5 22.5 A11 10 0 0 1 27 22.5" stroke-width="3.4"/>
      <path d="M0 22.5 H32" stroke-width="3.4"/>
    </g>
  </g>
</svg>
