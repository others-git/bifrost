<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <!-- Deep night sky -->
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#141831"/>
      <stop offset="100%" stop-color="#07070d"/>
    </linearGradient>

    <!-- Full-spectrum light sweeping diagonally along the rune -->
    <linearGradient id="spectrum" gradientUnits="userSpaceOnUse" x1="9" y1="5" x2="23" y2="27">
      <stop offset="0%"   stop-color="#a855f7"/>
      <stop offset="20%"  stop-color="#3b82f6"/>
      <stop offset="40%"  stop-color="#22d3ee"/>
      <stop offset="58%"  stop-color="#4ade80"/>
      <stop offset="75%"  stop-color="#facc15"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>

    <filter id="soften" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="1.3"/>
    </filter>
  </defs>

  <rect width="32" height="32" rx="7" fill="url(#sky)"/>

  <!-- Faint stars -->
  <circle cx="26.5" cy="20" r="0.5" fill="#e8ecff" opacity="0.5"/>
  <circle cx="6" cy="25" r="0.45" fill="#e8ecff" opacity="0.45"/>
  <circle cx="24" cy="11" r="0.4" fill="#e8ecff" opacity="0.4"/>

  <!-- Valhalla: small four-point star, upper right -->
  <path d="M26 3.4 L26.55 5.15 L28.3 5.7 L26.55 6.25 L26 8 L25.45 6.25 L23.7 5.7 L25.45 5.15 Z"
        fill="#f4f7ff" opacity="0.9"/>

  <!-- Berkana ᛒ — the Bifrost rune, drawn in full-spectrum light -->
  <!-- Glow underlay -->
  <g stroke="url(#spectrum)" fill="none" stroke-linecap="round" stroke-linejoin="round"
     opacity="0.4" filter="url(#soften)">
    <path d="M11 6 V26 M11 6 L21 11 L11 16 L21 21 L11 26" stroke-width="6"/>
  </g>
  <!-- Rune -->
  <g stroke="url(#spectrum)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M11 6 V26 M11 6 L21 11 L11 16 L21 21 L11 26" stroke-width="3.4"/>
  </g>
</svg>
