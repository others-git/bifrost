<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#141831"/>
      <stop offset="100%" stop-color="#07070d"/>
    </linearGradient>
    <filter id="soften" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="1.2"/>
    </filter>
  </defs>

  <!-- Full-bleed background; the OS applies its own mask shape. -->
  <rect width="32" height="32" fill="url(#sky)"/>

  <!-- Constellation pulled to ~78% so it stays inside the maskable safe zone. -->
  <g transform="translate(16 16.5) scale(0.78) translate(-16 -16.5)">
    <g stroke-width="1.3" opacity="0.7" stroke-linecap="round">
      <line x1="16" y1="16.5" x2="16"   y2="6.9"  stroke="#a855f7"/>
      <line x1="16" y1="16.5" x2="7.7"  y2="11.7" stroke="#3b82f6"/>
      <line x1="16" y1="16.5" x2="7.7"  y2="21.3" stroke="#22d3ee"/>
      <line x1="16" y1="16.5" x2="16"   y2="26.1" stroke="#4ade80"/>
      <line x1="16" y1="16.5" x2="24.3" y2="21.3" stroke="#facc15"/>
      <line x1="16" y1="16.5" x2="24.3" y2="11.7" stroke="#f43f5e"/>
    </g>
    <g filter="url(#soften)" opacity="0.45">
      <circle cx="16"   cy="6.9"  r="2.4" fill="#a855f7"/>
      <circle cx="7.7"  cy="11.7" r="2.4" fill="#3b82f6"/>
      <circle cx="7.7"  cy="21.3" r="2.4" fill="#22d3ee"/>
      <circle cx="16"   cy="26.1" r="2.4" fill="#4ade80"/>
      <circle cx="24.3" cy="21.3" r="2.4" fill="#facc15"/>
      <circle cx="24.3" cy="11.7" r="2.4" fill="#f43f5e"/>
    </g>
    <g>
      <circle cx="16"   cy="6.9"  r="1.8" fill="#a855f7"/>
      <circle cx="7.7"  cy="11.7" r="1.8" fill="#3b82f6"/>
      <circle cx="7.7"  cy="21.3" r="1.8" fill="#22d3ee"/>
      <circle cx="16"   cy="26.1" r="1.8" fill="#4ade80"/>
      <circle cx="24.3" cy="21.3" r="1.8" fill="#facc15"/>
      <circle cx="24.3" cy="11.7" r="1.8" fill="#f43f5e"/>
    </g>
    <circle cx="16" cy="16.5" r="3.4" fill="#f4f7ff" opacity="0.35" filter="url(#soften)"/>
    <circle cx="16" cy="16.5" r="2.5" fill="#f4f7ff"/>
  </g>
</svg>
